<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WRN Community Convening | Outreach</title><style>body{font:17px/1.6 system-ui;background:#f5f5f2;color:#202820;margin:0}main{max-width:720px;margin:auto;padding:28px}section{background:white;border:1px solid #ddd;border-radius:12px;padding:20px;margin:16px 0}button,input{font:inherit;padding:10px;border:1px solid #aaa;border-radius:6px}button{cursor:pointer;background:#234c3b;color:white;margin:4px}input{box-sizing:border-box;width:100%;margin:4px 0 12px}h1{line-height:1.15}h2{font-size:19px}label{display:block}small{color:#555}</style><main><small>WESTSIDE RESOURCE NETWORK</small><h1>Community Convening<br>Text outreach</h1><p>December 13, 2026 · 1–2:30 p.m. · Zoom / phone</p><button onclick="lang=0;render()">English</button><button onclick="lang=1;render()">Español</button><section><label>Recipient / Nombre<input id="person" placeholder="Name" oninput="render()"></label><label>Volunteer / Tu nombre<input id="vol" placeholder="Your name" oninput="render()"></label><label>Registration link / Enlace<input id="link" type="url" value="https://luma.com/1cahasl5" oninput="render()"></label></section><div id="scripts"></div><p id="status" role="status"></p></main><script>

['Invitación inicial',`¡Hola, ${n}! Soy ${v} de Westside Resource Network (WRN), la nueva organización sin fines de lucro que alberga el programa Westside Street Vendor Buyout. Estamos organizando un encuentro comunitario el domingo 13 de diciembre, de 1 a 2:30 p. m., para compartir lo que hemos estado haciendo y escuchar tus ideas sobre lo que debería hacer WRN en el futuro. Puedes participar por Zoom o por teléfono y habrá interpretación al español. ¿Podrás acompañarnos? Inscríbete aquí: ${l}`],['Si responde que sí',`¡Excelente! Nos dará mucho gusto verte.`],['Si responde que no','¡No te preocupes! Si tienes ideas sobre lo que debería hacer WRN o cómo podemos apoyar mejor a nuestra comunidad, nos encantaría escucharlas. Puedes escribirnos a westsideresource@gmail.com.'],['Si no está seguro/a',`¡No hay problema! Aquí tienes el enlace por si puedes acompañarnos: ${l}`],['Pregunta de seguimiento (para todos)','¿Te gustaría participar en WRN en el futuro? Estamos construyendo esta organización entre todos y nos encantaría que formaras parte de ella.'],['Si le interesa participar','¡Qué bueno! Te mantendremos al tanto de las oportunidades para participar.'],['Si no le interesa','¡No hay problema! Muchas gracias por tu tiempo.']]:[
['Initial invitation',`Hi ${n}! This is ${v} with Westside Resource Network (WRN), the new nonprofit home of the Westside Street Vendor Buyout. We're hosting a community gathering on Sunday, December 13, from 1–2:30 p.m. to share what we've been working on and hear your ideas about what WRN should do going forward. You can join via Zoom or by phone, and Spanish interpretation will be available. Would you be able to join us? RSVP here: ${l}`],['If YES',`Great! We look forward to seeing you there.`],['If NO',"That's okay! If you'd like to share any ideas about what WRN should do, what resources our community needs, or how we can better support our neighbors, we'd still love to hear from you. You can email us at westsideresource@gmail.com."],['If unsure',`No problem! Here's the registration link in case you're able to join us: ${l}`],['Follow-up question (regardless of attendance)',"Would you be interested in being involved with WRN going forward? We're building this organization together and would love to have you be part of it."],['If interested',"Wonderful! We'll keep you updated about opportunities to get involved."],['If not interested','No problem! Thank you for taking the time to connect with us.']];document.documentElement.lang=lang?'es':'en';$('scripts').replaceChildren();messages.forEach(([heading,msg],i)=>{let s=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('p'),b=document.createElement('button');h.textContent=heading;p.textContent=msg;b.textContent=lang?'Copiar mensaje':'Copy message';b.onclick=async()=>{try{await navigator.clipboard.writeText(msg);b.textContent=lang?'¡Copiado!':'Copied!'}catch(e){$('status').textContent='Please select and copy the message manually.'}};s.append(h,p,b);$('scripts').append(s)})}render();</script></html>
